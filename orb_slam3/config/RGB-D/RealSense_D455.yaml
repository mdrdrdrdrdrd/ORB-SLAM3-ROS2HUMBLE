%YAML:1.0

#--------------------------------------------------------------------------------------------
# RealSense D455 RGB-D settings for ORB-SLAM3 (640x480x30).
# Intrinsics below are nominal; replace with your camera's values from
#   rs-enumerate-devices -c
# or the /camera/camera/color/camera_info topic for best accuracy.
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 381.362
Camera1.fy: 381.362
Camera1.cx: 320.0
Camera1.cy: 240.0

# distortion parameters (D455 color is close to pinhole)
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0
Camera1.k3: 0.0

# Camera resolution
Camera.width: 640
Camera.height: 480

# Camera frames per second
Camera.fps: 30

# Images arrive as BGR (main.cpp converts with cv_bridge to BGR8)
Camera.RGB: 0

Stereo.ThDepth: 40.0
# D455 baseline = 95 mm
Stereo.b: 0.095

# Depth map values factor (Z16 -> millimetres)
RGBD.DepthMapFactor: 1000.0

# Dense mapping (this fork's point cloud accumulation)
# freeze_pose: keep already collected points stable instead of re-projecting
#              every keyframe with its latest BA/loop-closure pose.
DenseMap.freeze_pose: true
# voxel_leaf_size: downsampling leaf in metres (0 disables it)
DenseMap.voxel_leaf_size: 0.01

ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
